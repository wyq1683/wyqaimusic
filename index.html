    </div>
    <nav class="nav" id="nav" aria-label="主导航">
      <a class="nav-item" data-route="/home" href="#/home"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="#ic-nav-home"></use></svg>首页</a>
      <a class="nav-item" data-route="/library" href="#/library"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="#ic-nav-library"></use></svg>曲库</a>
      <a class="nav-item" data-route="/search" href="#/search"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="#ic-nav-search"></use></svg>搜索</a>
      <a class="nav-item" data-route="/favorites" href="#/favorites"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="#ic-nav-heart"></use></svg>收藏夹</a>
      <a class="nav-item" data-route="/playlists" href="#/playlists"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="#ic-nav-playlist"></use></svg>播放列表</a>
      <a class="nav-item" data-route="/history" href="#/history"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="#ic-nav-history"></use></svg>历史</a>

  <!-- 主内容 -->
  <main class="main" id="main" aria-label="主内容区">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" title="菜单" aria-label="打开菜单" aria-expanded="false"><svg width="20" height="20" aria-hidden="true"><use href="#ic-more"></use></svg></button>
      <div class="topbar-title" id="topbarTitle">首页</div>
      <div class="topbar-user" id="topbarUser"></div>
    </header>
    <section class="view" id="view" tabindex="-1"></section>
  </main>

  <!-- 底部播放条 -->
  <footer class="player-bar" id="playerBar" aria-label="播放控制">
    <div class="pb-left" id="pbLeft">
      <div class="pb-cover" id="pbCover" data-action="goto-nowplaying" role="button" tabindex="0" aria-label="打开正在播放页"></div>
      <div class="pb-meta">
        <div class="pb-title" id="pbTitle">未在播放</div>
        <div class="pb-artist" id="pbArtist">选择一首歌开始</div>
      </div>
      <button class="icon-btn pb-fav" id="pbFav" title="收藏" aria-label="收藏当前歌曲" aria-pressed="false"><svg width="18" height="18" aria-hidden="true"><use href="#ic-heart"></use></svg></button>
    </div>
    <div class="pb-center">
      <div class="pb-controls">
        <button class="icon-btn" id="btnShuffle" title="随机" aria-label="随机播放" aria-pressed="false"><svg width="18" height="18" aria-hidden="true"><use href="#ic-shuffle"></use></svg></button>
        <button class="icon-btn" id="btnPrev" data-haptic="light" title="上一首" aria-label="上一首"><svg width="20" height="20" aria-hidden="true"><use href="#ic-prev"></use></svg></button>
        <button class="icon-btn play-btn" id="btnPlay" data-haptic="medium" title="播放/暂停" aria-label="播放或暂停" aria-pressed="false"><svg width="22" height="22" aria-hidden="true"><use href="#ic-play"></use></svg></button>
        <button class="icon-btn" id="btnNext" data-haptic="light" title="下一首" aria-label="下一首"><svg width="20" height="20" aria-hidden="true"><use href="#ic-next"></use></svg></button>
        <button class="icon-btn" id="btnRepeat" title="循环" aria-label="循环模式" aria-pressed="false"><svg width="18" height="18" aria-hidden="true"><use href="#ic-repeat"></use></svg></button>
      </div>
      <div class="pb-progress">
        <span class="time" id="timeCur" aria-hidden="true">0:00</span>
        <input type="range" id="seek" class="seek" min="0" max="1" value="0" step="1" aria-label="播放进度" />
        <span class="time" id="timeDur" aria-hidden="true">0:00</span>
      </div>
    </div>
    <div class="pb-right">
      <button class="icon-btn" id="btnNow" title="更多" aria-label="更多选项" aria-haspopup="true" aria-expanded="false"><svg width="18" height="18" aria-hidden="true"><use href="#ic-more"></use></svg></button>
    </div>
  </footer>

  <!-- 播放条「更多」菜单 -->
  <div class="pb-menu" id="pbMenu" hidden role="menu">
    <button class="pb-menu-item" data-menu="info" role="menuitem"><svg width="16" height="16" aria-hidden="true"><use href="#ic-music"></use></svg>歌曲信息</button>
    <button class="pb-menu-item" data-menu="playlist" role="menuitem"><svg width="16" height="16" aria-hidden="true"><use href="#ic-nav-playlist"></use></svg>添加到歌单</button>
    <button class="pb-menu-item" data-menu="share" role="menuitem"><svg width="16" height="16" aria-hidden="true"><use href="#ic-nav-friends"></use></svg>分享给好友</button>
    <button class="pb-menu-item" data-menu="download" role="menuitem"><svg width="16" height="16" aria-hidden="true"><use href="#ic-expand"></use></svg>下载歌曲</button>
    <button class="pb-menu-item" data-menu="bg" role="menuitem"><svg width="16" height="16" aria-hidden="true"><use href="#ic-more"></use></svg>更换背景</button>
    <button class="pb-menu-item" data-menu="fullscreen" role="menuitem"><svg width="16" height="16" aria-hidden="true"><use href="#ic-expand"></use></svg>全屏沉浸</button>
      <button class="pb-menu-item" data-menu="haptic" role="menuitem"><svg width="16" height="16" aria-hidden="true"><use href="#ic-more"></use></svg><span>触感反馈</span><span class="pb-menu-hint" id="hapticHint">开启</span></button>
    <button class="pb-menu-item" data-menu="landscape" role="menuitem"><svg width="16" height="16" aria-hidden="true"><use href="#ic-landscape"></use></svg>横屏模式</button>
    <button type="button" class="pb-menu-item pb-boost-toggle" id="boostToggle" role="menuitem" aria-expanded="false">
      <svg width="16" height="16" aria-hidden="true"><use href="#ic-vol-high"></use></svg>
      <span>音量增强</span>
      <span class="pb-menu-hint" id="boostHint">100%</span>
    </button>
    <div class="pb-boost-options" id="boostOptions" hidden>
      <button class="pb-menu-item boost-opt" data-boost="1" role="menuitem"><span class="boost-dot"></span>正常 100%</button>
      <button class="pb-menu-item boost-opt" data-boost="1.25" role="menuitem"><span class="boost-dot"></span>增强 125%</button>
      <button class="pb-menu-item boost-opt" data-boost="1.5" role="menuitem"><span class="boost-dot"></span>增强 150%</button>
      <button class="pb-menu-item boost-opt" data-boost="2" role="menuitem"><span class="boost-dot"></span>增强 200%</button>
    </div>
  </div>

  <!-- 背景设置弹窗 -->
  <div class="modal-mask" id="bgMask" hidden role="dialog" aria-modal="true" aria-labelledby="bgTitle">
    <div class="modal bg-modal">
      <div class="modal-title" id="bgTitle">背景设置</div>
      <div class="bg-section">
        <div class="bg-section-label">预设背景</div>
        <div class="bg-presets" id="bgPresets"></div>
      </div>
      <div class="bg-section">
        <div class="bg-section-label">自定义背景</div>
        <label class="btn-ghost bg-upload-btn">
          上传图片
          <input type="file" id="bgFileInput" accept="image/*" hidden />
        </label>
      </div>
      <div class="bg-section bg-glass-row">
        <label for="bgBlurRange">背景模糊</label>
        <input type="range" id="bgBlurRange" class="bg-glass-range" min="0" max="30" step="1" value="6" aria-label="背景模糊" />
        <span class="bg-glass-value" id="bgBlurValue">6px</span>
      </div>
      <div class="bg-section bg-glass-row">
        <label for="bgGlassRange">界面透明度</label>
        <input type="range" id="bgGlassRange" class="bg-glass-range" min="0" max="100" step="1" value="30" aria-label="界面透明度" />
        <span class="bg-glass-value" id="bgGlassValue">30%</span>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="bgReset">恢复默认</button>
        <button class="btn-primary" id="bgClose">完成</button>
      </div>
    </div>
  </div>

  <!-- 登录 / 注册 弹窗 -->
  <div class="modal-mask" id="authMask" hidden role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="modal auth-modal">
      <div class="auth-head">
        <h2 id="authTitle" class="sr-only">登录或注册</h2>
        <div class="brand"><span class="brand-logo" aria-hidden="true">🎵</span><span class="brand-name">Wave</span></div>
        <p class="auth-sub">登录以同步收藏、播放列表与个性化推荐</p>
      </div>
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" data-tab="login" role="tab" aria-selected="true">登录</button>
        <button class="auth-tab" data-tab="register" role="tab" aria-selected="false">注册</button>
      </div>
      <form id="authForm" class="auth-form">
        <div class="form-field">
          <label for="authUser">用户名</label>
          <input type="text" id="authUser" autocomplete="username" placeholder="至少 3 个字符" />
        </div>
        <div class="form-field" id="emailField" hidden>
          <label for="authEmail">邮箱</label>
          <input type="email" id="authEmail" autocomplete="email" placeholder="用于接收登录验证码" />
        </div>
        <div class="form-field">
          <label for="authPass">密码</label>
          <input type="password" id="authPass" autocomplete="current-password" placeholder="至少 4 个字符" />
        </div>
        <div class="form-field" id="codeField" hidden>
          <label for="authCode">邮箱验证码</label>
          <input type="text" id="authCode" inputmode="numeric" maxlength="6" placeholder="6 位数字验证码" />
          <span class="auth-code-hint" id="codeHint"></span>
        </div>
        <div class="auth-error" id="authError" aria-live="polite"></div>
        <button type="submit" class="btn-primary" id="authSubmit">登录</button>
      </form>
      <div class="auth-demo">
        <span>演示账号：</span>
        <button class="link-btn" id="demoLogin">demo / demo1234</button>
      </div>
      <div class="auth-legal">
        登录/注册即表示同意<a href="terms.html" target="_blank" rel="noopener">《用户条款》</a>与<a href="privacy.html" target="_blank" rel="noopener">《隐私政策》</a>
      </div>
    </div>
  </div>

  <!-- 添加到播放列表 弹窗 -->
  <div class="modal-mask" id="plMask" hidden role="dialog" aria-modal="true" aria-labelledby="plModalTitle">
    <div class="modal pl-modal">
      <div class="modal-title" id="plModalTitle">添加到播放列表</div>
      <div class="pl-list" id="plList"></div>
      <div class="pl-new">
        <label for="plNewName" class="sr-only">新建歌单名称</label>
        <input type="text" id="plNewName" placeholder="新建歌单名称" />
        <button class="btn-primary" id="plNewBtn">新建</button>
      </div>
      <div class="pl-share-row">
        <button class="btn-ghost" id="plShareBtn" style="width:100%;display:flex;align-items:center;justify-content:center;gap:6px"><svg width="15" height="15" aria-hidden="true"><use href="#ic-nav-friends"></use></svg>分享给好友</button>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="plClose">关闭</button>
      </div>
    </div>
  </div>

  <!-- 分享歌曲给好友 弹窗 -->
  <div class="modal-mask" id="shareMask" hidden role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="modal share-modal">
      <div class="modal-title" id="shareTitle">分享给好友</div>
      <div class="share-song-card" id="shareSongCard"></div>
      <div class="share-list" id="shareFriendList"></div>
      <div class="share-msg-row">
        <input type="text" id="shareMsg" maxlength="200" placeholder="写一句分享留言（可选）" />
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="shareClose">取消</button>
      </div>
    </div>
  </div>

  <!-- 通用确认 / 输入弹窗 -->
  <div class="modal-mask" id="confirmMask" hidden role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal confirm-modal" style="width:380px">
      <div class="modal-title" id="confirmTitle">确认操作</div>
      <div class="confirm-message" id="confirmMessage"></div>
      <div class="confirm-input-wrap" id="confirmInputWrap" hidden>
        <label for="confirmInput" class="sr-only" id="confirmInputLabel">输入</label>
        <input type="text" id="confirmInput" />
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="confirmCancel">取消</button>
        <button class="btn-primary" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <!-- 编辑个人资料 弹窗 -->
  <div class="modal-mask" id="profileMask" hidden role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
    <div class="modal profile-modal">
      <div class="modal-title" id="profileModalTitle">编辑个人资料</div>
      <div class="profile-edit">
        <div class="form-field">
          <label>头像</label>
          <div class="avatar-picker" id="avatarPicker"></div>
          <div class="avatar-upload-row">
            <input type="text" id="pfAvatar" placeholder="粘贴图片 URL 或点右侧上传" />
            <label class="btn-ghost avatar-upload-btn" for="pfAvatarFile">上传图片</label>
            <input type="file" id="pfAvatarFile" accept="image/jpeg,image/png,image/gif,image/webp" hidden />
          </div>
        </div>
        <div class="form-field">
          <label for="pfNickname">昵称</label>
          <input type="text" id="pfNickname" maxlength="32" placeholder="你的昵称" />
        </div>
        <div class="form-field">
          <label>性别</label>
          <div class="gender-picker" id="genderPicker">
            <button type="button" data-gender="male">男</button>
            <button type="button" data-gender="female">女</button>
            <button type="button" data-gender="secret">保密</button>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="pfAge">年龄</label>
            <input type="number" id="pfAge" min="1" max="150" placeholder="年龄" />
          </div>
          <div class="form-field">
            <label for="pfRegion">地区</label>
            <input type="text" id="pfRegion" maxlength="64" placeholder="如：广东 广州" />
          </div>
        </div>
        <div class="form-field">
          <label for="pfHobby">爱好</label>
          <input type="text" id="pfHobby" maxlength="255" placeholder="如：音乐、摄影、旅行（逗号分隔）" />
        </div>
        <div class="form-field">
          <label for="pfSignature">个性签名</label>
          <textarea id="pfSignature" maxlength="200" rows="2" placeholder="写一句你的个性签名"></textarea>
        </div>
        <div class="form-field">
          <label>资料可见性</label>
          <div class="gender-picker" id="privacyPicker">
            <button type="button" data-privacy="0">公开</button>
            <button type="button" data-privacy="1">仅好友</button>
            <button type="button" data-privacy="2">私密</button>
          </div>
        </div>
        <div class="form-field">
          <label>我的兴趣（最多 8 个，用于推荐）</label>
          <div class="interest-chips" id="interestChips"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="pfCancel">取消</button>
        <button class="btn-primary" id="pfSave">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="true"></div>

  <!-- 全屏沉浸模式退出按钮 -->
  <button class="immersive-exit" id="immersiveExit" hidden aria-label="退出沉浸模式">✕ 退出沉浸</button>

  <!-- 移动端遮罩 -->
  <div class="scrim" id="scrim" hidden></div>

  <script src="js/data.js?v=20260910"></script>
  <script src="js/store.js?v=20260910"></script>
  <script src="js/recommend.js?v=20260910"></script>
  <script src="js/player.js?v=20260912"></script>
  <script src="js/particles.js?v=20260910"></script>
  <script src="js/ui.js?v=20260912"></script>
  <script src="js/app.js?v=20260910"></script>
  <div id="miniLyric" class="mini-lyric" hidden></div>
</body>
</html>
