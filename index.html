<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wave · 音乐播放器</title>
  <meta name="description" content="Wave 网页音乐播放器 — 网易云 / QQ音乐 / Audius 三音源，收藏、歌单、跨设备同步" />
  <link rel="stylesheet" href="css/tokens.css?v=20261030" />
  <link rel="stylesheet" href="css/base.css?v=20261030" />
  <link rel="stylesheet" href="css/app.css?v=20261030" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>" />
</head>
<body>
  <!-- ==================== 背景层：极光光斑 + 星光粒子 ==================== -->
  <div class="bg-aurora" aria-hidden="true">
    <span class="aurora a1"></span>
    <span class="aurora a2"></span>
    <span class="aurora a3"></span>
  </div>
  <canvas id="stars" class="bg-stars" aria-hidden="true"></canvas>
  <div class="bg-image" id="bgImage" aria-hidden="true" hidden></div>
  <div class="bg-veil" aria-hidden="true"></div>

  <!-- ==================== 应用骨架 ==================== -->
  <div class="shell">
    <!-- 移动端侧栏遮罩（必须与 .sidebar 同一层叠上下文，否则会盖住侧栏吞掉点击） -->
    <div class="sb-scrim" aria-hidden="true"></div>
    <!-- 侧边导航 -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand">
        <span class="sb-logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </span>
        <span class="sb-name">Wave</span>
        <button class="sb-collapse" id="sbCollapse" type="button" title="折叠导航" aria-label="折叠导航">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>

      <nav class="sb-nav" id="sbNav" aria-label="主导航"></nav>

      <div class="sb-playlists" id="sbPlaylists">
        <div class="sb-pl-head">
          <span>我的歌单</span>
          <button class="sb-pl-add" id="sbPlAdd" type="button" title="新建歌单" aria-label="新建歌单">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="sb-pl-list" id="sbPlList"></div>
      </div>

      <div class="sb-foot">
        <a class="sb-link" href="https://github.com/wyq1683/wyqaimusic" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
        <span class="sb-version">Wave 2.1</span>
      </div>
    </aside>

    <!-- 主区域 -->
    <div class="main-wrap" id="mainWrap">
      <header class="topbar">
        <button class="icon-btn nav-toggle" id="navToggle" type="button" aria-label="打开菜单" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button class="topbar-back" id="topbarBack" type="button" aria-label="返回" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="topbar-title" id="topbarTitle">发现</div>
        <button class="search-trigger" id="searchTrigger" type="button" aria-label="搜索">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span>搜索歌曲、艺人、专辑</span>
          <kbd>Ctrl K</kbd>
        </button>
        <div class="topbar-actions">
          <button class="icon-btn theme-btn" id="themeBtn" type="button" title="切换主题" aria-label="切换主题">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button class="topbar-user" id="topbarUser" type="button" aria-label="个人中心">
            <span class="tu-avatar" id="tuAvatar">游</span>
          </button>
        </div>
      </header>

      <!-- 路由进度条 -->
      <div class="route-progress" id="routeProgress" aria-hidden="true"></div>

      <!-- 视图挂载点 -->
      <main class="view" id="view" tabindex="-1"></main>

      <!-- 底部播放条 -->
      <footer class="player-bar" id="playerBar">
        <div class="pb-song">
          <button class="pb-cover" id="pbCover" type="button" aria-label="打开正在播放">
            <span class="pb-cover-img" id="pbCoverImg"></span>
            <span class="pb-cover-play" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </span>
          </button>
          <div class="pb-meta">
            <div class="pb-title" id="pbTitle">未在播放</div>
            <div class="pb-artist" id="pbArtist">选一首歌开始旅程</div>
          </div>
          <button class="icon-btn pb-fav" id="pbFav" type="button" aria-label="收藏当前歌曲" aria-pressed="false">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
        </div>
        <div class="pb-center">
          <div class="pb-controls">
            <button class="icon-btn" id="btnShuffle" type="button" aria-label="随机播放" aria-pressed="false" title="随机播放">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
            </button>
            <button class="icon-btn" id="btnPrev" type="button" aria-label="上一首" title="上一首">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
            </button>
            <button class="play-btn" id="btnPlay" type="button" aria-label="播放或暂停" title="播放/暂停">
              <svg class="ic-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg class="ic-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="icon-btn" id="btnNext" type="button" aria-label="下一首" title="下一首">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
            </button>
            <button class="icon-btn" id="btnRepeat" type="button" aria-label="循环模式" title="循环模式">
              <svg class="ic-repeat" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1l4 4-4 4"/><path d="M3 7.5V6a3 3 0 0 1 3-3h14.1"/><path d="M7 21.9l-4-4 4-4"/><path d="M21 16.5V18a3 3 0 0 1-3 3H3.9"/></svg>
              <svg class="ic-repeat-one" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17 2.1l4 4-4 4"/><path d="M3 7.5V6a3 3 0 0 1 3-3h14.1"/><path d="M7 21.9l-4-4 4-4"/><path d="M21 16.5V18a3 3 0 0 1-3 3H3.9"/><path d="M11 10h4v1.5a1.5 1.5 0 0 1-1.5 1.5H13v1"/><path d="M13 15h-2v-2h2"/></svg>
            </button>
          </div>
          <div class="pb-progress">
            <span class="pb-time" id="timeCur">0:00</span>
            <div class="pb-seek" id="seekWrap">
              <div class="pb-seek-fill" id="seekFill"></div>
              <div class="pb-seek-knob" id="seekKnob"></div>
              <input type="range" id="seek" min="0" max="1000" value="0" aria-label="播放进度" />
            </div>
            <span class="pb-time" id="timeDur">0:00</span>
          </div>
        </div>
        <div class="pb-extra">
          <button class="icon-btn vol-btn" id="volBtn" type="button" aria-label="音量" title="音量">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
          </button>
          <div class="vol-pop" id="volPop" hidden>
            <input type="range" id="volRange" min="0" max="100" value="80" aria-label="音量滑块" />
            <span id="volVal">80%</span>
          </div>
          <button class="icon-btn" id="btnLyric" type="button" aria-label="歌词" title="歌词" aria-pressed="false">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </button>
          <button class="icon-btn" id="btnQueue" type="button" aria-label="播放队列" title="播放队列" aria-pressed="false">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
          </button>
          <button class="icon-btn" id="btnMore" type="button" aria-label="更多选项" title="更多" aria-haspopup="menu" aria-expanded="false">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
        </div>
      </footer>
    </div><!-- /main-wrap -->

    <!-- 右侧抽屉：队列 / 歌词（桌面端） -->
    <aside class="drawer" id="drawer" aria-label="播放工作台" hidden>
      <div class="drawer-head">
        <div class="drawer-tabs" role="tablist">
          <button class="dtab active" type="button" data-dtab="queue" role="tab" aria-selected="true">队列 <span class="dtab-count" id="drawerQueueCount">0</span></button>
          <button class="dtab" type="button" data-dtab="lyric" role="tab" aria-selected="false">歌词</button>
          <button class="dtab" type="button" data-dtab="look" role="tab" aria-selected="false">外观</button>
        </div>
        <button class="icon-btn drawer-close" id="drawerClose" type="button" aria-label="关闭">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="drawer-body">
        <div class="dpane" id="drawerQueue" role="tabpanel"></div>
        <div class="dpane" id="drawerLyric" role="tabpanel" hidden></div>
        <div class="dpane" id="drawerLook" role="tabpanel" hidden></div>
      </div>
    </aside>

  </div>

  <!-- 移动端底部导航 -->
  <nav class="tabbar" id="tabbar" aria-label="底部导航"></nav>

  <!-- ==================== 浮层根节点 ==================== -->
  <div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="true"></div>
  <div class="modal-root" id="modalRoot"></div>
  <div class="menu-root" id="menuRoot"></div>
  <div class="palette-root" id="paletteRoot"></div>

  <!-- ==================== 图标库 ==================== -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></symbol>
      <symbol id="i-library" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>

      <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
      <symbol id="i-heart-fill" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
      <symbol id="i-playlist" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-trend" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
      <symbol id="i-disc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98"/><path d="M15.41 6.51l-6.83 3.98"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></symbol>
      <symbol id="i-chev-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></symbol>
      <symbol id="i-chev-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></symbol>
